<div class="front" id="front">
    <canvas id="canvas" width="350px" height="350px"></canvas>
    <a href="" id="link"><h4 id="text"><u>link to position</u></h4></a>
</div>

<script>
var ctx = document.getElementById('canvas').getContext('2d');

var w = 7;
var h = 6;

var link = document.getElementById('link');
var text = document.getElementById('text');
var back = document.getElementById('back');

var rawSetup = "{{Setup}}";
var rawMove = "{{Move}}";

var position = "43";
var cardtype = "nextmove:";
if(!rawSetup.startsWith('(')) {
    // rawSetup field looks something like: "nextmove:43"
    // Parse out the position and the prefix before and after the colon.
    var colonIndex = rawSetup.indexOf(':');
    position = rawSetup.substring(colonIndex + 1);
    cardtype = rawSetup.substring(0, colonIndex + 1);
}
var solution = rawMove.startsWith('(') ? '6' : rawMove;
if(back) position += solution;

var EMPTY  = '#669';
var RED    = '#f00';
var YELLOW = '#ff0';

ctx.textAlign = 'center';
ctx.font = '48px Arial';

var grid = Array.from({ length: h }, () => Array.from({ length: w }, () => EMPTY));

link.href = 'https://connect4.gamesolver.org/?pos=' + position;
text.textContent = 'link to position';

var isCellEmpty = (row, col) => {
    return grid[row][col] === EMPTY;
};

var move = (x, col) => {
    for (let y = 0; y < h; y++) {
        if (isCellEmpty(y, x)) {
            grid[y][x] = col;
            return y;
        }
    }
    return -1;
};

var populateGrid = () => {
    let col = RED;
    for (let i = 0; i < position.length; i++) {
        const x = parseInt(position[i]) - 1;
        move(x, col);
        col = (col === RED) ? YELLOW : RED;
    }
};

var drawStone = (xCoord, yCoord, color) => {
    var stoneRadius = 20;
    var x = (xCoord + 0.5) * 50;
    var y = (h - yCoord - 0.5) * 50;
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(x, y, stoneRadius, 0, 2 * Math.PI, false);
    ctx.fill();
};

var render = () => {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
            var color = grid[y][x];
            drawStone(x, y, color);
        }
    }
};

populateGrid();
render();
</script>
