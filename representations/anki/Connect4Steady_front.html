<div class="front" id="front">
    <canvas id="canvas" width="350px" height="300px"></canvas>
    <h4 id="text">Pick a priority level, then click the squares that get it. Flip when done!</h4>
    <div id="palette"></div>
</div>

<script>
var w = 7;
var h = 6;

var ctx = document.getElementById('canvas').getContext('2d');
var canvasEl = document.getElementById('canvas');
var back = document.getElementById('back');

var rawDiagram = "{{Diagram}}";
var rows = rawDiagram.split(",");
var storageKey = 'c4steady:' + rawDiagram;

var LEVELS = "0123456789";
var EMPTY = '#669';
var GUESS_COLOR = '#eee';
var CORRECT_COLOR = '#7cff7c';
var WRONG_COLOR = '#ff5c5c';
var DISK_COLOR = { 'R': '#f00', 'Y': '#ff0' };
// A red -> amber -> green -> blue ramp: strong levels warm, weak levels cool.
var LEVEL_COLOR = {};
for (var i = 0; i < LEVELS.length; i++) LEVEL_COLOR[LEVELS[i]] = 'hsl(' + Math.round(i * 256 / LEVELS.length) + ',70%,62%)';

var isDisk = (ch) => ch === 'R' || ch === 'Y';

var blankGuess = () => rows.map((row) => row.split('').map(() => ''));

var loadGuess = () => {
    try {
        var raw = localStorage.getItem(storageKey);
        if (raw) return JSON.parse(raw);
    } catch (e) {}
    return blankGuess();
};

var saveGuess = (guess) => {
    try { localStorage.setItem(storageKey, JSON.stringify(guess)); } catch (e) {}
};

// On a fresh front view this is a new attempt, so start blank. On the back
// (embedded copy of this same script via {{FrontSide}}) read back whatever
// was guessed during the front view that just happened, for grading.
var guess = back ? loadGuess() : blankGuess();
if (!back) saveGuess(guess);
var selectedSymbol = '';

var drawDisk = (x, y, color) => {
    var cx = (x + 0.5) * 50;
    var cy = (y + 0.5) * 50;
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(cx, cy, 20, 0, 2 * Math.PI, false);
    ctx.fill();
};

var drawSymbol = (x, y, ch, color) => {
    ctx.fillStyle = color;
    ctx.font = 'bold 26px Arial';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(ch, (x + 0.5) * 50, (y + 0.5) * 50);
};

var drawRing = (x, y, color) => {
    ctx.strokeStyle = color;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc((x + 0.5) * 50, (y + 0.5) * 50, 22, 0, 2 * Math.PI, false);
    ctx.stroke();
};

// A port of query_steady_state/verify_leaf from solution/validate_solution.py:
// true iff Red, following the guessed diagram from this board, beats every
// Yellow continuation. board[y][x] has y=0 at the bottom; 0 empty, 1 Red, 2 Yellow.
var steadyStateWins = (levels) => {
    var board = [];
    var heights = [];
    for (let y = 0; y < h; y++) {
        board.push([]);
        for (let x = 0; x < w; x++) {
            var ch = (rows[h - 1 - y] || '')[x];
            board[y].push(ch === 'R' ? 1 : ch === 'Y' ? 2 : 0);
        }
    }
    for (let x = 0; x < w; x++) {
        var y = 0;
        while (y < h && board[y][x]) y++;
        heights.push(y);
    }

    var makesFour = (x, y, player) => {
        var dirs = [[1, 0], [0, 1], [1, 1], [1, -1]];
        for (let d = 0; d < dirs.length; d++) {
            var count = 1;
            for (let sign = -1; sign <= 1; sign += 2) {
                var nx = x + sign * dirs[d][0], ny = y + sign * dirs[d][1];
                while (nx >= 0 && nx < w && ny >= 0 && ny < h && board[ny][nx] === player) {
                    count++;
                    nx += sign * dirs[d][0];
                    ny += sign * dirs[d][1];
                }
            }
            if (count >= 4) return true;
        }
        return false;
    };

    var winsAt = (x, player) => {
        var y = heights[x];
        if (y >= h) return false;
        board[y][x] = player;
        var won = makesFour(x, y, player);
        board[y][x] = 0;
        return won;
    };

    var full = () => heights.every((ht) => ht >= h);

    // Red's column per the priority list, or -1 for a tie or no instruction.
    var redMove = () => {
        for (let player = 1; player <= 2; player++) {
            for (let x = 0; x < w; x++) if (winsAt(x, player)) return x;
        }
        for (let i = 0; i < LEVELS.length; i++) {
            var found = [];
            for (let x = 0; x < w; x++) {
                if (heights[x] < h && levels[h - 1 - heights[x]][x] === LEVELS[i]) found.push(x);
            }
            if (found.length === 1) return found[0];
        }
        return -1;
    };

    for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
            if (board[y][x] && makesFour(x, y, board[y][x])) return false;
        }
    }

    var memo = {};
    var redTurn = () => {
        var key = board.map((r) => r.join('')).join('');
        if (memo[key]) return true;
        var x = redMove();
        if (x < 0) return false;
        var y = heights[x];
        board[y][x] = 1;
        heights[x]++;
        var ok = true;
        if (!makesFour(x, y, 1)) {
            if (full()) ok = false;
            for (let yx = 0; ok && yx < w; yx++) {
                var yy = heights[yx];
                if (yy >= h) continue;
                board[yy][yx] = 2;
                heights[yx]++;
                ok = !makesFour(yx, yy, 2) && !full() && redTurn();
                heights[yx]--;
                board[yy][yx] = 0;
            }
        }
        heights[x]--;
        board[y][x] = 0;
        if (ok) memo[key] = true;
        return ok;
    };
    return redTurn();
};

var guessWins = back ? steadyStateWins(guess) : false;
if (back) {
    var textEl = document.getElementById('text');
    textEl.textContent = guessWins
        ? 'Your steady state wins!'
        : 'Your steady state does not win. Here is the reference; red rings mark where yours differs.';
    textEl.style.color = guessWins ? CORRECT_COLOR : WRONG_COLOR;
}

var render = () => {
    for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) drawDisk(x, y, EMPTY);
    }
    for (let y = 0; y < h; y++) {
        var row = rows[y] || '';
        for (let x = 0; x < w; x++) {
            var ch = row[x];
            if (isDisk(ch)) {
                drawDisk(x, y, DISK_COLOR[ch]);
                continue;
            }
            if (back) {
                let actual = LEVEL_COLOR[ch] ? ch : '';
                let guessed = (guess[y] && guess[y][x]) || '';
                if (guessWins) {
                    // Any winning diagram is right: show the user's own.
                    if (guessed) drawSymbol(x, y, guessed, LEVEL_COLOR[guessed]);
                    continue;
                }
                if (actual) drawSymbol(x, y, actual, LEVEL_COLOR[actual]);
                else if (guessed) drawSymbol(x, y, guessed, '#888');
                if (actual || guessed) drawRing(x, y, guessed === actual ? CORRECT_COLOR : WRONG_COLOR);
            } else {
                let guessed = (guess[y] && guess[y][x]) || '';
                if (guessed) drawSymbol(x, y, guessed, GUESS_COLOR);
            }
        }
    }
};

if (!back) {
    var paletteEl = document.getElementById('palette');
    var swatchEls = {};
    var paintKeys = [{ key: '.', symbol: '' }];
    for (var k = 0; k < LEVELS.length; k++) paintKeys.push({ key: LEVELS[k], symbol: LEVELS[k] });

    paintKeys.forEach((entry) => {
        var btn = document.createElement('button');
        btn.textContent = entry.symbol || '✕';
        btn.style.margin = '1px';
        btn.style.fontWeight = 'bold';
        btn.style.color = entry.symbol ? LEVEL_COLOR[entry.symbol] : '#eee';
        btn.addEventListener('click', () => selectSymbol(entry.symbol));
        paletteEl.appendChild(btn);
        swatchEls[entry.symbol] = btn;
    });

    var selectSymbol = (symbol) => {
        selectedSymbol = symbol;
        paintKeys.forEach((entry) => {
            swatchEls[entry.symbol].style.outline = entry.symbol === symbol ? '2px solid #fff' : 'none';
        });
    };
    selectSymbol('');

    // Shortcuts that paint every open cell with one level at once.
    var fillRow = document.createElement('div');
    ['1', '5', '9'].forEach((symbol) => {
        var btn = document.createElement('button');
        btn.textContent = 'All ' + symbol;
        btn.style.margin = '1px';
        btn.style.fontWeight = 'bold';
        btn.style.color = LEVEL_COLOR[symbol];
        btn.addEventListener('click', () => {
            for (let y = 0; y < h; y++) {
                var row = rows[y] || '';
                for (let x = 0; x < w; x++) {
                    if (!isDisk(row[x])) guess[y][x] = symbol;
                }
            }
            saveGuess(guess);
            render();
        });
        fillRow.appendChild(btn);
    });
    paletteEl.appendChild(fillRow);

    document.addEventListener('keydown', (e) => {
        var entry = paintKeys.find((p) => p.key === e.key);
        if (entry) selectSymbol(entry.symbol);
    });

    canvasEl.addEventListener('click', (e) => {
        var rect = canvasEl.getBoundingClientRect();
        var x = Math.floor((e.clientX - rect.left) / 50);
        var y = Math.floor((e.clientY - rect.top) / 50);
        if (x < 0 || x >= w || y < 0 || y >= h) return;
        var row = rows[y] || '';
        if (isDisk(row[x])) return;
        guess[y][x] = selectedSymbol;
        saveGuess(guess);
        render();
    });
}

render();
</script>
