name: Publish GitHub Pages

# Publishes the site at https://2swap.github.io/WeakC4/, from the tree as it
# stood at the commit that triggered the run.
#
# That tree can carry artifacts one rebuild behind. rebuild.yml commits the
# corrected graph.js afterwards, and a GITHUB_TOKEN push starts no further
# workflow run, so those corrected artifacts sit in main until the next push
# publishes them.
#
# The site is representations/webclient/ with explanation/ mounted beneath it:
# index.html links to "explanation" and the explanation pages link back with
# "../", so they have to be served one level apart.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v5
      - name: Assemble the site
        run: |
          mkdir _site
          cp sample.png _site/
          cp -r representations/webclient/. _site/
          cp -r explanation _site/explanation
          # webclient/ also holds the scripts that generate the page and the
          # layout file they work on, none of which the browser fetches.
          rm -rf _site/render.py _site/spread_graph.py _site/__pycache__ \
                 _site/positions.txt
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
