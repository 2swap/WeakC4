name: Publish GitHub Pages

# Publishes the site at https://2swap.github.io/WeakC4/. Runs on every commit
# to main, so the live site never lags behind whatever's currently checked in.
#
# The site is representations/webclient/ with explanation/ mounted beneath it:
# index.html links to "explanation" and the explanation pages link back with
# "../", so they have to be served one level apart.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v5
      - name: Assemble the site
        run: |
          mkdir _site
          cp -r representations/webclient/. _site/
          cp -r explanation _site/explanation
          rm -rf _site/render.py _site/__pycache__
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
