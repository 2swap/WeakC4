name: Publish GitHub Pages

# Publishes representations/webclient/ as the site at
# https://2swap.github.io/WeakC4/. Runs whenever that directory changes on
# main - including the commit rebuild.yml itself makes when it regenerates
# graph.js, so the live site always reflects the latest rebuilt graph.

on:
  push:
    branches: [main]
    paths:
      - representations/webclient/**
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: representations/webclient
      - id: deployment
        uses: actions/deploy-pages@v4
