name: Publish GitHub Pages

# Publishes representations/webclient/ as the site at
# https://2swap.github.io/WeakC4/. Runs on every commit to main, so the live
# site never lags behind whatever's currently checked in there.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: representations/webclient
      - id: deployment
        uses: actions/deploy-pages@v4
