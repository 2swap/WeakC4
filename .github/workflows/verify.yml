name: Verify contributions

# Runs on every pull request: exhaustively validates the whole solution/
# graph. Read-only, so it is safe on fork branches.

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.event.pull_request.number }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash   # for -o pipefail, so a failure piped through tee still fails

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v7
        with: {python-version: '3.12'}

      - name: Inspect the diff
        env:
          BASE: ${{ github.base_ref }}   # via env, never pasted into the command
        run: |
          git fetch --quiet origin "$BASE"
          changed=$(git diff --name-only "origin/$BASE...HEAD")
          echo "$changed"

          if grep -qE '^representations/(webclient/graph\.js|protobuf/.*\.pb)$' <<<"$changed"; then
            echo "::error::representations/ artifacts are generated by each subdirectory's render.py and are rebuilt automatically after merge. Edit solution/branches.txt or solution/steady_states.txt instead."
            exit 1
          fi

      - name: Whole-graph check
        run: |
          python solution/validate_solution.py \
            --markdown | tee -a "$GITHUB_STEP_SUMMARY"
