name: Verify contributions

# Runs on every commit - both direct pushes and pull requests - exhaustively
# validating the whole solution/ graph. Read-only, so it is safe on fork
# branches.

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash   # for -o pipefail, so a failure piped through tee still fails

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v7
        with: {python-version: '3.12'}

      - name: Inspect the diff
        env:
          BASE: ${{ github.base_ref }}         # set for pull_request events
          BEFORE: ${{ github.event.before }}   # set for push events
        run: |
          if [ -n "$BASE" ]; then
            git fetch --quiet origin "$BASE"
            changed=$(git diff --name-only "origin/$BASE...HEAD")
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            changed=$(git diff --name-only "$BEFORE" HEAD)
          else
            changed=""   # first commit on a new branch: nothing to compare against
          fi
          echo "$changed"

          if grep -qE '^representations/(webclient/graph\.js|protobuf/.*\.pb)$' <<<"$changed"; then
            echo "::error::representations/ artifacts are generated by each subdirectory's render.py and are rebuilt automatically after merge. Edit solution/branches.txt or solution/steady_states.txt instead."
            exit 1
          fi

      - name: Whole-graph check
        run: |
          python solution/validate_solution.py \
            --markdown | tee -a "$GITHUB_STEP_SUMMARY"
