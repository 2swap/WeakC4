name: Verify contributions

# Runs on every pull request: exhaustively checks each new diagram and reports
# how much smaller it makes the graph. Read-only, so it is safe on fork branches.

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.event.pull_request.number }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash   # for -o pipefail, so a failure piped through tee still fails

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v7
        with: {python-version: '3.12'}
      - run: pip install --quiet protobuf

      - name: Inspect the diff
        env:
          BASE: ${{ github.base_ref }}   # via env, never pasted into the command
        run: |
          git fetch --quiet origin "$BASE"
          changed=$(git diff --name-only "origin/$BASE...HEAD")
          echo "$changed"

          if grep -qE '^(c4_full\.js|protobuf/c4_full\.pb\.gz)$' <<<"$changed"; then
            echo "::error::c4_full.js and protobuf/c4_full.pb.gz are generated by build_graph.py and are rebuilt automatically after merge. Edit steady_states.txt instead, and revert those two files."
            exit 1
          fi

          # Adding a diagram cannot invalidate an existing one: validity depends
          # only on a diagram's own position and markers. Changing the verifier
          # or the base graph can, so only then is the whole graph rechecked.
          if grep -qE '^(verify_steady_states\.py|build_graph\.py|graph/)' <<<"$changed"; then
            echo "FULL=1" >> "$GITHUB_ENV"
          fi

          git show "origin/$BASE:steady_states.txt" > /tmp/baseline.txt 2>/dev/null \
            || : > /tmp/baseline.txt

      - name: Verify new diagrams
        run: |
          python verify_steady_states.py --entries --baseline /tmp/baseline.txt \
            --markdown | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Verifier self-test
        run: |
          python verify_steady_states.py --self-test 200 --graph graph/base_c4_full.js \
            --markdown | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Rebuild and measure
        run: |
          python build_graph.py --baseline /tmp/baseline.txt \
            --markdown | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Whole-graph check
        if: env.FULL == '1'
        # c4_full.js here is the one the previous step just rebuilt, not the
        # committed artifact. Named explicitly so that stays true.
        run: |
          python verify_steady_states.py --graph c4_full.js \
            --markdown | tee -a "$GITHUB_STEP_SUMMARY"
