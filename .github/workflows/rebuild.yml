name: Rebuild representations

# Runs after anything lands on main that can change a representation:
# validates the whole solution/ graph, regenerates whichever representations
# need it, and commits any changed artifacts.
#
# It runs here rather than inside the pull request on purpose. A workflow
# triggered by a fork's pull request would need write access to push the
# rebuilt files back, and granting that would let an untrusted branch run its
# own code with write permissions. Here the code has already been merged.

on:
  push:
    branches: [main]
    paths:
      - solution/branches.txt
      - solution/steady_states.txt
      - solution/positions.txt
      - representations/webclient/**
      - representations/protobuf/**
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rebuild-main

defaults:
  run:
    shell: bash

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v7
        with: {python-version: '3.12'}
      - run: pip install --quiet protobuf

      - name: Verify the whole graph
        run: python solution/validate_solution.py --markdown | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Decide what changed
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ -z "$BEFORE" ] \
             || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "manually triggered (or no prior commit to diff against): rendering everything"
            echo "RENDER_WEBCLIENT=1" >> "$GITHUB_ENV"
            echo "RENDER_PROTOBUF=1" >> "$GITHUB_ENV"
          else
            changed=$(git diff --name-only "$BEFORE" HEAD)
            echo "$changed"

            # A representation's render.py always reads solution/branches.txt
            # and solution/steady_states.txt, so a change to either can break
            # any representation; a change only inside one representation's
            # own directory can only break that one.
            if grep -qE '^solution/(branches|steady_states)\.txt$' <<<"$changed"; then
              echo "RENDER_WEBCLIENT=1" >> "$GITHUB_ENV"
              echo "RENDER_PROTOBUF=1" >> "$GITHUB_ENV"
            fi
            # positions.txt is layout only, and the protobuf carries no layout,
            # so a coordinate change concerns the webclient alone.
            if grep -q '^solution/positions\.txt$' <<<"$changed"; then
              echo "RENDER_WEBCLIENT=1" >> "$GITHUB_ENV"
            fi
            if grep -q '^representations/webclient/' <<<"$changed"; then
              echo "RENDER_WEBCLIENT=1" >> "$GITHUB_ENV"
            fi
            if grep -q '^representations/protobuf/' <<<"$changed"; then
              echo "RENDER_PROTOBUF=1" >> "$GITHUB_ENV"
            fi
          fi

      - name: Render webclient
        if: env.RENDER_WEBCLIENT == '1'
        run: python representations/webclient/render.py

      - name: Render protobuf
        if: env.RENDER_PROTOBUF == '1'
        run: python representations/protobuf/render.py

      - name: Commit if changed
        run: |
          if git diff --quiet -- representations/; then
            echo "artifacts already up to date"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add representations/
          git commit -m "Rebuild representations"
          # A commit landing on main during the rebuild rejects this push. If it
          # did not touch the sources above, these artifacts are still correct
          # and rebasing publishes them; if it did, it queued its own rebuild
          # that supersedes this one. Without the retry the representations
          # just stay stale until the next qualifying push.
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            echo "push rejected, rebasing onto main (attempt $attempt)"
            git pull --rebase origin main
          done
          git push
